- step: 
    name: print-env
    environment: tpad
    image: python 
    command: |
      echo "yo"
      env | grep LEVEL
      python -c '
      from os import getenv 
      value = getenv("SECRET_PROJECT_LEVEL", default="oh nouth, dfault")
      print("|", end="")
      for c in value:
        print(c, end="_")
      print("|")
      '
    environment-variables: 
      - name: STEP_LEVEL
        default: step_value
      - name: SECRET_PROJECT_LEVEL
        default: "YAML_DEFAULT"


- pipeline: 
    name: env-pipe

    nodes: 
      - name: node_1
        step: print-env
        type: execution 
      - name: node_2
        step: print-env
        type: execution 
    edges: 
      - [node_1.dependency.*, node_2.dependency.*]

